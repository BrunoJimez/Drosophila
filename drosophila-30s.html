<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Drosophila — um curta de 30 segundos</title>
<style>
  html,body{margin:0;background:#14100e;color:#e8dfd0;
    font-family:ui-monospace,Menlo,monospace;display:flex;
    flex-direction:column;align-items:center;padding:18px;gap:12px}
  canvas{border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.7)}
  .bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  button{padding:10px 22px;border:0;border-radius:6px;font:600 14px inherit;
    cursor:pointer;background:#c9683a;color:#fff;transition:.2s}
  button:hover{background:#e08050}
  button:disabled{background:#4a3a30;color:#999;cursor:not-allowed}
  #st{font-size:12px;color:#9a8a7a;text-align:center;max-width:820px;line-height:1.5}
  .time{font-size:11px;color:#c9683a;letter-spacing:.15em}
</style>
</head>
<body>
<canvas id="c" width="820" height="820"></canvas>
<div class="bar">
  <button id="preview">▶ Assistir com som</button>
  <button id="rec">● Gravar filme (30 s)</button>
  <button id="stop" disabled>■ Parar</button>
</div>
<div class="time" id="clock">00:00 / 00:30</div>
<div id="st">Curta procedural — canvas 2D + Web Audio API, sem imagens ou sons externos.</div>

<script>
/* ============================================================
   0. CONFIG E UTILITÁRIOS
   ============================================================ */
const W = 820, H = 820;
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
const DURATION = 30;   // segundos

const lerp     = (a,b,t) => a + (b-a)*t;
const clamp01  = x => x < 0 ? 0 : x > 1 ? 1 : x;
const smooth   = (a,b,x) => { const t = clamp01((x-a)/(b-a)); return t*t*(3-2*t); };
const easeInOut= t => t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2,2)/2;

function makeRng(seed){
  let a = seed >>> 0;
  return () => {
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ============================================================
   1. PRIMITIVAS DE ESBOÇO (mesmas da v2)
   ============================================================ */
function sketchLine(g, x1, y1, x2, y2, opt = {}){
  const passes = opt.passes ?? 2, wob = opt.wob ?? 1.2;
  const alpha = opt.alpha ?? 0.85, color = opt.color ?? '#2a1a10';
  const width = opt.width ?? 1.1;
  const rng = makeRng((x1*127 + y1*311 + x2*613 + y2*887 + (opt.seed||0))|0);
  const len = Math.hypot(x2-x1, y2-y1);
  const n = Math.max(3, Math.floor(len/22));
  g.strokeStyle = color; g.globalAlpha = alpha;
  g.lineWidth = width; g.lineCap = 'round';
  for(let p=0;p<passes;p++){
    g.beginPath();
    g.moveTo(x1 + (rng()-.5)*wob, y1 + (rng()-.5)*wob);
    for(let i=1;i<=n;i++){
      const u = i/n;
      const tx = x1 + (x2-x1)*u, ty = y1 + (y2-y1)*u;
      g.quadraticCurveTo(tx + (rng()-.5)*wob*1.8, ty + (rng()-.5)*wob*1.8,
                         tx + (rng()-.5)*wob*0.6, ty + (rng()-.5)*wob*0.6);
    }
    g.stroke();
  }
  g.globalAlpha = 1;
}

function sketchEllipse(g, cx, cy, rx, ry, rot=0, opt={}){
  const passes = opt.passes ?? 2, wob = opt.wob ?? 1.4;
  const rng = makeRng((cx*17 + cy*31 + rx*53 + ry*97)|0);
  const n = 40;
  g.strokeStyle = opt.color ?? '#2a1a10';
  g.lineWidth   = opt.width ?? 1.1;
  g.lineCap     = 'round';
  for(let p=0;p<passes;p++){
    g.globalAlpha = (opt.alpha ?? 0.85) * (p===0 ? 1 : 0.55);
    g.beginPath();
    for(let i=0;i<=n;i++){
      const th = (i/n)*Math.PI*2;
      const nx = Math.cos(th)*rx + (rng()-.5)*wob;
      const ny = Math.sin(th)*ry + (rng()-.5)*wob;
      const x = cx + nx*Math.cos(rot) - ny*Math.sin(rot);
      const y = cy + nx*Math.sin(rot) + ny*Math.cos(rot);
      if(i===0) g.moveTo(x,y); else g.lineTo(x,y);
    }
    g.closePath(); g.stroke();
  }
  g.globalAlpha = 1;
}

/* ============================================================
   2. FUNDO PRÉ-RENDERIZADO (fruta)
   ============================================================ */
const bg = document.createElement('canvas'); bg.width = W; bg.height = H;
const b  = bg.getContext('2d');

function renderBackground(){
  b.fillStyle = '#f3e6c8'; b.fillRect(0,0,W,H);
  const r0 = makeRng(7);
  for(let i=0;i<40;i++){
    const x = -200 + i*45 + r0()*20;
    b.strokeStyle = `rgba(200,170,120,${0.05 + r0()*0.06})`;
    b.lineWidth = 12 + r0()*30;
    b.beginPath(); b.moveTo(x, -50); b.lineTo(x + 260, H*0.55); b.stroke();
  }
  const fcx = W*0.42, fcy = H*1.18, fR = H*1.05;
  const g = b.createRadialGradient(fcx, fcy - fR*0.55, 40, fcx, fcy, fR);
  g.addColorStop(0,   '#f2b98a');
  g.addColorStop(0.35,'#e2955e');
  g.addColorStop(0.7, '#c96e3c');
  g.addColorStop(0.92,'#a34e28');
  g.addColorStop(1,   '#7d3820');
  b.save();
  b.beginPath(); b.arc(fcx, fcy, fR, 0, Math.PI*2); b.clip();
  b.fillStyle = g; b.fillRect(0,0,W,H);

  const rng = makeRng(42);
  for(let i=0;i<14000;i++){
    const a = rng()*Math.PI*2;
    const r = Math.sqrt(rng()) * fR;
    const x = fcx + Math.cos(a)*r, y = fcy + Math.sin(a)*r;
    if(x<-40||x>W+40||y<-40||y>H+40) continue;
    const len = 6 + rng()*30;
    const dir = a + Math.PI/2 + (rng()-.5)*0.8;
    const dr  = r/fR;
    const lum = 60 + (1-dr)*80;
    const al  = 0.05 + rng()*0.14 * (0.5+dr);
    b.strokeStyle = `rgba(${lum+70|0}, ${lum*0.6+30|0}, ${lum*0.35+15|0}, ${al})`;
    b.lineWidth = 0.4 + rng()*1.1;
    b.beginPath();
    b.moveTo(x,y);
    b.quadraticCurveTo(x+Math.cos(dir)*len*.5, y+Math.sin(dir)*len*.5,
                       x+Math.cos(dir)*len,    y+Math.sin(dir)*len);
    b.stroke();
  }
  const rng2 = makeRng(99);
  for(let i=0;i<2200;i++){
    const a = rng2()*Math.PI*2;
    const r = fR*(0.72 + rng2()*0.35);
    const x = fcx + Math.cos(a)*r, y = fcy + Math.sin(a)*r;
    if(x<-20||x>W+20||y<-20||y>H+20) continue;
    const dir = a + Math.PI/2 + (rng2()-.5)*1.2;
    const L = 10 + rng2()*40;
    b.strokeStyle = `rgba(80, 28, 12, ${0.06 + rng2()*0.18})`;
    b.lineWidth = 0.5 + rng2()*1.3;
    b.beginPath(); b.moveTo(x,y);
    b.lineTo(x+Math.cos(dir)*L, y+Math.sin(dir)*L); b.stroke();
  }
  const shine = b.createRadialGradient(W*0.30, H*0.62, 4,
                                       W*0.30, H*0.62, 80);
  shine.addColorStop(0,'rgba(255,240,210,0.35)');
  shine.addColorStop(1,'rgba(255,240,210,0)');
  b.fillStyle = shine; b.fillRect(0,0,W,H);
  b.restore();

  b.save();
  b.strokeStyle = '#3a1e10'; b.lineWidth = 1.6; b.lineCap='round';
  const rng3 = makeRng(2024);
  for(let pass=0; pass<2; pass++){
    b.globalAlpha = pass===0 ? 0.9 : 0.5;
    b.beginPath();
    for(let x=0; x<=W; x+=8){
      const ang = Math.acos(Math.max(-1,Math.min(1,(x-fcx)/fR)));
      const y = fcy - Math.sin(ang)*fR + (rng3()-.5)*1.6;
      if(x===0) b.moveTo(x,y); else b.lineTo(x,y);
    }
    b.stroke();
  }
  b.restore();
}
renderBackground();

/* ============================================================
   3. ELEMENTOS ANATÔMICOS (v2 aprimorados)
   ============================================================ */

/* ---- OVO com trincas progressivas ---- */
function drawEgg(g, t, crack, vis){
  if(vis <= 0.01) return;
  const cx = 175, cy = 610;
  const r = 14 + Math.sin(t/900)*0.4;

  g.save();
  g.globalAlpha = vis;

  const gl = g.createRadialGradient(cx-3, cy-4, 1, cx, cy, r*1.6);
  gl.addColorStop(0,'rgba(255,255,240,0.85)');
  gl.addColorStop(0.6,'rgba(245,235,205,0.55)');
  gl.addColorStop(1,'rgba(245,235,205,0)');
  g.fillStyle = gl;
  g.beginPath(); g.arc(cx, cy, r*1.6, 0, Math.PI*2); g.fill();

  g.fillStyle = '#f8efd6';
  g.beginPath(); g.ellipse(cx, cy, r, r*0.82, -0.15, 0, Math.PI*2); g.fill();
  g.fillStyle = 'rgba(180,140,90,0.25)';
  g.beginPath(); g.ellipse(cx+3, cy+3, r*0.7, r*0.55, -0.15, 0, Math.PI*2); g.fill();

  sketchEllipse(g, cx, cy, r, r*0.82, -0.15,
                {color:'#6a4020', width:1.0, wob:0.7, alpha:0.7});

  /* trincas progressivas */
  if(crack > 0){
    const cracks = [
      [[-8,-8], [-2,-3], [4,-6], [9,-2]],
      [[-10, 2], [-3, 1],  [5, 4],  [10, 3]],
      [[-6, 9],  [0, 6],   [6, 8]]
    ];
    const nCrack = Math.ceil(crack * cracks.length);
    for(let i=0;i<nCrack;i++){
      const path = cracks[i];
      const sub = i === nCrack-1 ? (crack*cracks.length - i) : 1;
      g.strokeStyle = 'rgba(80,40,20,0.9)';
      g.lineWidth = 0.9;
      g.beginPath(); g.moveTo(cx+path[0][0], cy+path[0][1]);
      for(let j=1;j<path.length;j++){
        if(j > sub*(path.length-1)+0.001) break;
        g.lineTo(cx+path[j][0], cy+path[j][1]);
      }
      g.stroke();
    }
  }

  g.fillStyle = 'rgba(255,255,255,0.7)';
  g.beginPath(); g.ellipse(cx-4, cy-4, 3, 2, -0.5, 0, Math.PI*2); g.fill();
  g.restore();
}

/* ---- LARVA (reutilizada da v2) ---- */
function drawLarva(g, x, y, t, vis){
  if(vis <= 0.01) return;
  const segments = 7, len = 90;
  const amp = 14 * Math.sin(t * 3);
  g.save();
  g.globalAlpha = vis;
  g.translate(x, y);
  for(let i = 0; i < segments; i++){
    const px = (i - segments/2) * (len/segments);
    const py = Math.sin(i * 0.9 + t * 4) * amp * 0.4;
    const r = 6 + Math.sin(i * 0.8) * 3;
    g.beginPath();
    g.arc(px, py, r, 0, Math.PI * 2);
    g.fillStyle = `hsl(${40 + i * 4}, 70%, ${55 + i * 2}%)`;
    g.fill();
    g.strokeStyle = 'rgba(0,0,0,0.25)';
    g.lineWidth = 1; g.stroke();
  }
  g.beginPath();
  g.arc(-len/2 - 4, 0, 8, 0, Math.PI * 2);
  g.fillStyle = '#b8860b'; g.fill();
  g.beginPath();
  g.arc(-len/2 - 7, -3, 2, 0, Math.PI * 2);
  g.arc(-len/2 - 7,  3, 2, 0, Math.PI * 2);
  g.fillStyle = '#222'; g.fill();
  g.restore();
}

/* ---- PUPA (abre a tampa quando `capOpen` cresce) ---- */
function drawPupa(g, t, vis, capOpen){
  if(vis <= 0.01) return;
  const cx = 545, cy = 640;
  const tilt = -0.42;
  const rw = 78, rh = 130;
  const breathe = 1 + Math.sin(t/700)*0.008;

  g.save();
  g.globalAlpha = vis;
  g.translate(cx, cy);
  g.rotate(tilt);

  /* sombra */
  g.fillStyle = 'rgba(60,20,10,0.28)';
  g.beginPath();
  g.ellipse(6, rh+8, rw*1.1, 16, 0, 0, Math.PI*2);
  g.filter = 'blur(6px)'; g.fill(); g.filter = 'none';

  /* corpo */
  const g1 = g.createLinearGradient(-rw, 0, rw, 0);
  g1.addColorStop(0,   '#5a2a16');
  g1.addColorStop(0.35,'#8a4422');
  g1.addColorStop(0.65,'#a2542b');
  g1.addColorStop(1,   '#4a1f0e');
  g.fillStyle = g1;
  g.beginPath();
  g.ellipse(0, 0, rw*breathe, rh*breathe, 0, 0, Math.PI*2);
  g.fill();

  /* anéis */
  for(let i=-3; i<=3; i++){
    const y = i * 26;
    const k = Math.sqrt(Math.max(0, 1 - (y*y)/(rh*rh)));
    const w2 = rw * k;
    sketchLine(g, -w2+4, y, w2-4, y, {
      color:'#2a1008', width:1.2, wob:1.4, alpha:0.55, seed:500+i });
    g.strokeStyle = 'rgba(255,200,150,0.10)'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(-w2+4, y+1.4); g.lineTo(w2-4, y+1.4); g.stroke();
  }

  /* topo aberto com interior claro, deslocado por capOpen */
  g.save();
  g.translate(capOpen * 20, -rh + 6 - capOpen * 30);
  g.rotate(capOpen * 0.7);
  g.beginPath();
  g.ellipse(0, 0, rw*0.85, 16, 0, Math.PI, Math.PI*2);
  g.closePath();
  g.fillStyle = '#e9d3a6'; g.fill();
  g.strokeStyle = '#2a1008'; g.lineWidth = 1.2; g.stroke();
  const gp = g.createRadialGradient(0,4,2, 0,4, rw*0.8);
  gp.addColorStop(0, 'rgba(80,40,20,0.5)');
  gp.addColorStop(1, 'rgba(80,40,20,0)');
  g.fillStyle = gp;
  g.beginPath(); g.ellipse(0, 6, rw*0.8, 12, 0, 0, Math.PI*2); g.fill();
  g.restore();

  /* interior escuro (só aparece se a tampa abriu) */
  if(capOpen > 0.05){
    g.save();
    g.globalAlpha *= capOpen;
    g.beginPath();
    g.ellipse(0, -rh + 8, rw*0.72, 12, 0, 0, Math.PI*2);
    g.fillStyle = '#1a0a05'; g.fill();
    g.restore();
  }

  /* retalho de casca destacado */
  g.save();
  g.translate(rw*0.85, -rh*0.55 + capOpen*25);
  g.rotate(0.5 + capOpen*0.8);
  g.beginPath();
  g.moveTo(0,0);
  g.bezierCurveTo(30,-6, 55,10, 60,34);
  g.bezierCurveTo(40,30, 18,22, 0,0);
  g.fillStyle = '#f0dbb0'; g.fill();
  sketchLine(g, 0,0, 60,34, {color:'#3a1e10', width:1.1, wob:1.5, seed:77});
  sketchLine(g, 0,0, 60,10, {color:'#3a1e10', width:1.0, wob:1.2, seed:78, alpha:0.6});
  sketchLine(g, 5,3, 55,28, {color:'#3a1e10', width:0.9, wob:1.2, seed:79, alpha:0.5});
  g.restore();

  sketchEllipse(g, 0, 0, rw, rh, 0,
                {color:'#2a1008', width:1.5, wob:1.8, passes:2, alpha:0.9});

  g.restore();
}

/* ---- MOSCA ADULTA (asas, pernas, abdômen, tórax, cabeça) ---- */
function drawWings(g, t, spread, flapRate = 120){
  const flap = Math.sin(t/flapRate)*0.06;
  const baseA = 0.35 + spread*0.35 + flap;

  g.save();
  g.translate(-6, -8);
  g.rotate(-baseA);
  const wg = g.createLinearGradient(0,0, 120,-30);
  wg.addColorStop(0,   'rgba(240,235,220,0.85)');
  wg.addColorStop(0.7, 'rgba(220,225,235,0.55)');
  wg.addColorStop(1,   'rgba(200,215,235,0.25)');
  g.fillStyle = wg;
  g.beginPath();
  g.moveTo(0,0);
  g.bezierCurveTo(30,-22, 90,-38, 128,-22);
  g.bezierCurveTo(120,-6, 80,4, 26,4);
  g.bezierCurveTo(14,4, 4,3, 0,0);
  g.closePath(); g.fill();
  sketchLine(g, 0,0, 128,-22, {color:'#3a2818', width:1.0, wob:1.0, passes:1, alpha:0.55, seed:11});
  sketchLine(g, 0,0, 108,4,   {color:'#3a2818', width:1.0, wob:1.0, passes:1, alpha:0.55, seed:12});
  g.strokeStyle = 'rgba(60,40,25,0.45)'; g.lineWidth = 0.7;
  const v1 = [[10,0, 42,-12, 70,-16, 100,-14],[12,1, 50,-2, 88,-2, 116,-4],
              [14,2, 50,4, 86,4, 108,2],[30,-10, 44,-6, 58,-4],
              [60,-14, 70,-6, 78,-2],[84,-14, 88,-8, 92,-4]];
  for(const v of v1){
    g.beginPath(); g.moveTo(v[0], v[1]);
    for(let i=2;i<v.length;i+=2) g.lineTo(v[i], v[i+1]);
    g.stroke();
  }
  g.restore();

  g.save();
  g.translate(-6, 8);
  g.rotate(baseA * 0.9);
  g.fillStyle = wg;
  g.beginPath();
  g.moveTo(0,0);
  g.bezierCurveTo(30,20, 88,34, 124,18);
  g.bezierCurveTo(118,2, 78,-6, 24,-4);
  g.bezierCurveTo(12,-4, 4,-3, 0,0);
  g.closePath(); g.fill();
  sketchLine(g, 0,0, 124,18, {color:'#3a2818', width:1.0, wob:1.0, passes:1, alpha:0.55, seed:21});
  sketchLine(g, 0,0, 104,-4, {color:'#3a2818', width:1.0, wob:1.0, passes:1, alpha:0.55, seed:22});
  g.strokeStyle = 'rgba(60,40,25,0.45)'; g.lineWidth = 0.7;
  const v2 = [[10,0, 40,10, 68,14, 96,12],[12,-1, 50,2, 88,2, 112,4],
              [30,8, 44,4, 58,2],[60,12, 70,6, 78,2]];
  for(const v of v2){
    g.beginPath(); g.moveTo(v[0], v[1]);
    for(let i=2;i<v.length;i+=2) g.lineTo(v[i], v[i+1]);
    g.stroke();
  }
  g.restore();
}

function drawLegs(g){
  const legs = [
    {x:-18,y:8,j1:[-36,26],j2:[-44,52],j3:[-38,76]},
    {x:-14,y:14,j1:[-30,34],j2:[-34,62],j3:[-24,84]},
    {x:-8,y:18,j1:[-18,40],j2:[-16,68],j3:[4,86]},
    {x:22,y:6,j1:[38,26],j2:[46,52],j3:[38,78]},
    {x:26,y:12,j1:[34,34],j2:[40,62],j3:[28,84]},
    {x:28,y:18,j1:[24,40],j2:[22,68],j3:[6,86]}
  ];
  for(const L of legs){
    g.strokeStyle = '#2a1a10'; g.lineCap = 'round';
    g.lineWidth = 1.5; g.beginPath();
    g.moveTo(L.x, L.y);
    g.quadraticCurveTo((L.x+L.j1[0])/2, (L.y+L.j1[1])/2, L.j1[0], L.j1[1]);
    g.stroke();
    g.lineWidth = 1.2; g.beginPath();
    g.moveTo(L.j1[0], L.j1[1]); g.lineTo(L.j2[0], L.j2[1]); g.stroke();
    g.lineWidth = 0.9; g.beginPath();
    g.moveTo(L.j2[0], L.j2[1]); g.lineTo(L.j3[0], L.j3[1]); g.stroke();
    g.beginPath(); g.moveTo(L.j3[0], L.j3[1]);
    g.lineTo(L.j3[0]+3, L.j3[1]+5); g.stroke();
  }
}

function drawAbdomen(g){
  g.save(); g.rotate(0.15);
  const grad = g.createLinearGradient(0,-30, 0,40);
  grad.addColorStop(0,   '#d8c9a8');
  grad.addColorStop(0.5, '#c3b088');
  grad.addColorStop(1,   '#a58c62');
  g.fillStyle = grad;
  g.beginPath();
  g.moveTo(-30,-16);
  g.bezierCurveTo(-6,-28, 60,-24, 88,-6);
  g.bezierCurveTo(96, 4, 96, 20, 84, 28);
  g.bezierCurveTo(50, 40, 0, 34, -26, 14);
  g.closePath(); g.fill();
  for(let i=0;i<6;i++){
    const u = i/6;
    const x0 = -22 + u*105;
    g.fillStyle = `rgba(40,26,14,${0.35 + Math.sin(u*Math.PI)*0.35})`;
    g.beginPath();
    g.moveTo(x0, -22 + u*4);
    g.quadraticCurveTo(x0+7, -3, x0+2, 22 + u*6);
    g.lineTo(x0+10, 22 + u*6);
    g.quadraticCurveTo(x0+15, -3, x0+12, -22 + u*4);
    g.closePath(); g.fill();
  }
  const rng = makeRng(303);
  for(let i=0;i<26;i++){
    const u = rng();
    const x = -20 + u*100;
    const y = -22 + Math.sin(u*Math.PI)*3 + rng()*6;
    g.strokeStyle = 'rgba(30,20,10,0.55)'; g.lineWidth = 0.55;
    g.beginPath();
    g.moveTo(x, y); g.lineTo(x + (rng()-.5)*6, y - 6 - rng()*5); g.stroke();
  }
  g.strokeStyle = '#2a1a10'; g.lineWidth = 1.3; g.globalAlpha = 0.9;
  g.beginPath();
  g.moveTo(-30,-16);
  g.bezierCurveTo(-6,-28, 60,-24, 88,-6);
  g.bezierCurveTo(96, 4, 96, 20, 84, 28);
  g.bezierCurveTo(50, 40, 0, 34, -26, 14);
  g.closePath(); g.stroke();
  g.globalAlpha = 1; g.restore();
}

function drawThorax(g){
  const grad = g.createRadialGradient(-6,-8, 4, 0,0, 40);
  grad.addColorStop(0,   '#d8cdb4');
  grad.addColorStop(0.6, '#b6a888');
  grad.addColorStop(1,   '#857152');
  g.fillStyle = grad;
  g.beginPath(); g.ellipse(-4, 0, 32, 26, 0, 0, Math.PI*2); g.fill();
  const rng = makeRng(777);
  for(let i=0;i<48;i++){
    const a = rng()*Math.PI*2;
    const r = 22 + rng()*10;
    const x = -4 + Math.cos(a)*r;
    const y = 0  + Math.sin(a)*r*0.85;
    const L = 6 + rng()*11;
    g.strokeStyle = `rgba(40,26,14,${0.35 + rng()*0.45})`;
    g.lineWidth = 0.6 + rng()*0.5;
    g.beginPath(); g.moveTo(x, y);
    g.lineTo(x + Math.cos(a)*L*(0.8+rng()*0.6),
             y + Math.sin(a)*L*(0.8+rng()*0.6));
    g.stroke();
  }
  sketchEllipse(g, -4, 0, 32, 26, 0,
                {color:'#2a1a10', width:1.3, wob:1.4, passes:2});
}

function drawHead(g){
  const grad = g.createRadialGradient(-52,-6, 2, -46,-2, 24);
  grad.addColorStop(0,   '#cfc3a8');
  grad.addColorStop(0.6, '#a89878');
  grad.addColorStop(1,   '#7c6a4a');
  g.fillStyle = grad;
  g.beginPath(); g.ellipse(-46, -2, 22, 20, 0, 0, Math.PI*2); g.fill();

  function eye(cx, cy, r){
    const e = g.createRadialGradient(cx-r*0.3, cy-r*0.3, 1, cx, cy, r);
    e.addColorStop(0,   '#f6a89a');
    e.addColorStop(0.4, '#cf4b3e');
    e.addColorStop(0.85,'#8a1c14');
    e.addColorStop(1,   '#4c0a08');
    g.fillStyle = e;
    g.beginPath(); g.arc(cx, cy, r, 0, Math.PI*2); g.fill();
    g.save();
    g.beginPath(); g.arc(cx, cy, r, 0, Math.PI*2); g.clip();
    const rng = makeRng((cx*31 + cy*97)|0);
    for(let i=0;i<70;i++){
      const a = rng()*Math.PI*2;
      const rr = Math.sqrt(rng())*r;
      g.fillStyle = `rgba(255,220,200,${0.05 + rng()*0.18})`;
      g.beginPath();
      g.arc(cx+Math.cos(a)*rr, cy+Math.sin(a)*rr, 1 + rng()*1.2, 0, Math.PI*2);
      g.fill();
    }
    g.restore();
    sketchEllipse(g, cx, cy, r, r, 0,
                  {color:'#3a1008', width:1.1, wob:1.0, passes:2, alpha:0.8});
  }
  eye(-62, -10, 14);
  eye(-58,   6, 13);

  sketchEllipse(g, -46, -2, 22, 20, 0,
                {color:'#2a1a10', width:1.2, wob:1.4, passes:2});

  /* antenas */
  g.strokeStyle = '#2a1a10'; g.lineWidth = 1.1; g.lineCap='round';
  g.beginPath();
  g.moveTo(-62,-16);
  g.bezierCurveTo(-84,-32, -108,-34, -122,-24);
  g.stroke();
  for(let i=0;i<6;i++){
    const px = -122 + i*1.6, py = -24 + i*1.4;
    g.beginPath(); g.moveTo(px, py); g.lineTo(px + 4, py - 6); g.stroke();
  }
  g.beginPath(); g.moveTo(-58,-6);
  g.bezierCurveTo(-80,-8, -100,-4, -114, 2);
  g.stroke();
}

function drawAdultFly(g, t, pos, scale, spread, flapRate){
  g.save();
  g.translate(pos.x, pos.y);
  g.rotate(pos.rot || 0);
  g.scale(scale, scale);
  g.rotate(Math.sin(t/900) * 0.015);
  drawWings(g, t, spread, flapRate);
  drawLegs(g);
  drawAbdomen(g);
  drawThorax(g);
  drawHead(g);
  g.restore();
}

/* ============================================================
   4. MOTOR DE SOM — Web Audio API
   ============================================================ */
class SoundEngine {
  constructor(){
    this.ctx = null;
    this.master = null;
    this.dest = null;      // MediaStreamAudioDestinationNode
    this.noiseBuf = null;
    this.activeSources = [];
  }

  async init(){
    if(this.ctx) { await this.ctx.resume(); return; }
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    if(this.ctx.state === 'suspended') await this.ctx.resume();

    this.master = this.ctx.createGain();
    this.master.gain.value = 0.9;

    this.dest = this.ctx.createMediaStreamDestination();
    this.master.connect(this.dest);
    // (não conectamos a destination para não tocar durante preview;
    //  quem quiser ouvir ao vivo usa .monitor())
    this.monitorGain = this.ctx.createGain();
    this.monitorGain.gain.value = 0;   // mudo por padrão
    this.master.connect(this.monitorGain);
    this.monitorGain.connect(this.ctx.destination);

    // buffer de ruído reutilizável
    const sr = this.ctx.sampleRate;
    const len = sr * 2;
    this.noiseBuf = this.ctx.createBuffer(1, len, sr);
    const d = this.noiseBuf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = Math.random()*2 - 1;
  }

  monitor(on){ if(this.monitorGain) this.monitorGain.gain.value = on ? 0.35 : 0; }

  /* Envelope auxiliar */
  env(gainNode, t0, attack, sustain, release, peak){
    const g = gainNode.gain;
    g.cancelScheduledValues(t0);
    g.setValueAtTime(0.0001, t0);
    g.exponentialRampToValueAtTime(peak, t0 + attack);
    g.setValueAtTime(peak, t0 + attack + sustain);
    g.exponentialRampToValueAtTime(0.0001, t0 + attack + sustain + release);
  }

  /* --- Pad ambiente (0-30 s) --- */
  pad(t0, dur){
    const freqs = [110, 165, 220.5];
    freqs.forEach((f, i) => {
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      const filt = this.ctx.createBiquadFilter();
      filt.type = 'lowpass';
      filt.frequency.value = 600 + i*100;
      filt.Q.value = 0.9;
      osc.type = 'sine';
      osc.frequency.value = f;
      osc.detune.value = (i-1)*6;
      this.env(g, t0, 3, dur-8, 5, 0.05);
      osc.connect(filt); filt.connect(g); g.connect(this.master);
      osc.start(t0); osc.stop(t0 + dur);
      this.activeSources.push(osc);
    });

    /* LFO sutil na amplitude do pad */
    const lfo = this.ctx.createOscillator();
    const lfoGain = this.ctx.createGain();
    lfo.frequency.value = 0.08;
    lfoGain.gain.value = 300;
    lfo.connect(lfoGain);
    // liga o LFO a cada filtro (aproximação)
    lfo.start(t0); lfo.stop(t0 + dur);
  }

  /* --- Estalo de casca --- */
  crack(t0){
    const src = this.ctx.createBufferSource();
    src.buffer = this.noiseBuf;
    src.playbackRate.value = 1.6;
    const filt = this.ctx.createBiquadFilter();
    filt.type = 'bandpass';
    filt.frequency.value = 2200 + Math.random()*1800;
    filt.Q.value = 4.5;
    const g = this.ctx.createGain();
    this.env(g, t0, 0.002, 0.01, 0.09, 0.22);
    src.connect(filt); filt.connect(g); g.connect(this.master);
    src.start(t0); src.stop(t0 + 0.15);
  }

  /* --- Clique de passos da larva --- */
  tick(t0){
    const osc = this.ctx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.value = 900 + Math.random()*400;
    const g = this.ctx.createGain();
    this.env(g, t0, 0.002, 0.005, 0.03, 0.06);
    osc.connect(g); g.connect(this.master);
    osc.start(t0); osc.stop(t0 + 0.06);
  }

  /* --- Hum crescente (pupação / emergência) --- */
  risingHum(t0, dur, f0, f1, peak){
    const osc = this.ctx.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(f0, t0);
    osc.frequency.exponentialRampToValueAtTime(f1, t0 + dur);

    const filt = this.ctx.createBiquadFilter();
    filt.type = 'lowpass';
    filt.frequency.setValueAtTime(400, t0);
    filt.frequency.exponentialRampToValueAtTime(1800, t0 + dur);
    filt.Q.value = 3;

    const g = this.ctx.createGain();
    this.env(g, t0, dur*0.35, dur*0.3, dur*0.4, peak);

    osc.connect(filt); filt.connect(g); g.connect(this.master);
    osc.start(t0); osc.stop(t0 + dur);
  }

  /* --- Flutter das asas (AM de ~30 Hz) --- */
  flutter(t0, dur, carrier, peak){
    const osc = this.ctx.createOscillator();
    osc.type = 'square';
    osc.frequency.value = carrier;

    const mod = this.ctx.createOscillator();
    mod.frequency.value = 28 + Math.random()*6;
    const modGain = this.ctx.createGain();
    modGain.gain.value = 0.9;
    mod.connect(modGain);

    const g = this.ctx.createGain();
    g.gain.value = 0;
    modGain.connect(g.gain);

    const out = this.ctx.createGain();
    this.env(out, t0, 0.05, dur-0.3, 0.3, peak);

    const filt = this.ctx.createBiquadFilter();
    filt.type = 'bandpass';
    filt.frequency.value = carrier * 3;
    filt.Q.value = 1.5;

    osc.connect(g); g.connect(filt); filt.connect(out); out.connect(this.master);
    osc.start(t0); osc.stop(t0 + dur);
    mod.start(t0); mod.stop(t0 + dur);
  }

  /* --- Whoosh de decolagem --- */
  whoosh(t0, dur){
    const src = this.ctx.createBufferSource();
    src.buffer = this.noiseBuf;
    src.playbackRate.setValueAtTime(0.4, t0);
    src.playbackRate.exponentialRampToValueAtTime(2.2, t0 + dur);

    const filt = this.ctx.createBiquadFilter();
    filt.type = 'bandpass';
    filt.frequency.setValueAtTime(180, t0);
    filt.frequency.exponentialRampToValueAtTime(2600, t0 + dur);
    filt.Q.value = 1.2;

    const g = this.ctx.createGain();
    this.env(g, t0, 0.1, dur*0.4, dur*0.5, 0.35);

    src.connect(filt); filt.connect(g); g.connect(this.master);
    src.start(t0); src.stop(t0 + dur + 0.2);
  }

  /* --- Agenda TODOS os sons do filme a partir de t0 (ctx.currentTime) --- */
  scheduleFilm(t0){
    /* pad ambiente */
    this.pad(t0, DURATION);

    /* estalos de casca (4,0 – 6,1) */
    this.crack(t0 + 4.0);
    this.crack(t0 + 4.7);
    this.crack(t0 + 5.3);
    this.crack(t0 + 5.9);

    /* larva rastejando (6,5 – 13) */
    for(let i=0;i<22;i++){
      const tt = t0 + 6.8 + i * 0.28 + Math.random()*0.05;
      if(tt > t0 + 13) break;
      this.tick(tt);
    }

    /* pupação (13 – 16) */
    this.risingHum(t0 + 13, 3, 80, 180, 0.08);

    /* emergência (20 – 26) */
    this.risingHum(t0 + 20, 6, 60, 260, 0.12);

    /* abertura das asas / flutter (26 – 28.3) */
    this.flutter(t0 + 26, 2.3, 170, 0.09);

    /* decolagem (28 – 29.4) */
    this.whoosh(t0 + 28, 1.4);

    /* fades finais (29,4 – 30) */
    const fadeGain = this.ctx.createGain();
    fadeGain.gain.setValueAtTime(1, t0 + DURATION - 0.9);
    fadeGain.gain.linearRampToValueAtTime(0, t0 + DURATION);
    // aplicado globalmente via master
    this.master.gain.setValueAtTime(0.9, t0);
    this.master.gain.setValueAtTime(0.9, t0 + DURATION - 1.0);
    this.master.gain.linearRampToValueAtTime(0, t0 + DURATION);
  }

  stream(){
    return this.dest ? this.dest.stream : null;
  }

  stopAll(){
    this.activeSources.forEach(s => { try { s.stop(); } catch(e){} });
    this.activeSources = [];
    if(this.ctx){
      try { this.ctx.close(); } catch(e){}
      this.ctx = null; this.master = null; this.dest = null;
      this.monitorGain = null; this.noiseBuf = null;
    }
  }
}

const sound = new SoundEngine();

/* ============================================================
   5. CENA — TIMELINE DE 30 SEGUNDOS
   ============================================================ */
const TL = {
  EGG:          [0, 7],
  CRACK:        [4.0, 6.0],
  HATCH:        6.5,
  LARVA_CRAWL:  [7, 13],
  PUPA_FORM:    [13, 15],
  PUPA_OPEN:    [20, 22],
  EMERGE:       [22, 26],
  WING_SPREAD:  26.5,
  TAKEOFF:      28.0,
  FLIGHT:       [28.0, 30]
};

/* Posições fixas na cena */
const EGG_POS  = { x: 175, y: 610 };
const PUPA_POS = { x: 545, y: 640 };

function drawScene(t){
  /* 1. fundo */
  ctx.drawImage(bg, 0, 0);

  /* 2. OVO */
  const eggVis = 1 - smooth(6.9, 7.4, t);
  const crackP = smooth(TL.CRACK[0], TL.CRACK[1], t);
  if(eggVis > 0.01) drawEgg(ctx, t*1000, crackP, eggVis);

  /* 3. LARVA */
  if(t >= 6.5 && t < 14.5){
    const visIn  = smooth(6.5, 7.0, t);
    const visOut = 1 - smooth(13.0, 14.0, t);
    const vis    = Math.min(visIn, visOut);
    /* caminho: sai do ovo, rasteja em S até a posição da pupa */
    const u = smooth(7, 13, t);
    const x = lerp(EGG_POS.x + 20, PUPA_POS.x - 20, u);
    const y = lerp(EGG_POS.y - 4,  PUPA_POS.y - 20, u)
              + Math.sin(u * Math.PI * 4) * 20;
    /* rotação para "olhar" na direção do movimento */
    const rot = Math.atan2((PUPA_POS.y - EGG_POS.y), (PUPA_POS.x - EGG_POS.x));
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    drawLarva(ctx, 0, 0, t * 6, vis);
    ctx.restore();

    /* casquinha abandonada */
    if(t > 7.5){
      ctx.save();
      ctx.globalAlpha = 0.6 * (1 - smooth(12, 14, t));
      ctx.strokeStyle = '#6a4020'; ctx.lineWidth = 0.9;
      ctx.beginPath();
      ctx.ellipse(EGG_POS.x-4, EGG_POS.y+6, 8, 4, -0.3, 0.3, Math.PI*1.4);
      ctx.stroke();
      ctx.restore();
    }
  }

  /* 4. PUPA (aparece em 13-15 s, "fecha" o corpo da larva) */
  const pupaVis = smooth(13, 15, t) * (1 - smooth(28.5, 29.5, t));
  const pupaCapOpen = smooth(TL.PUPA_OPEN[0], TL.PUPA_OPEN[1], t);
  /* tremor da pupa antes de abrir */
  const shake = smooth(20, 21, t) * (1 - smooth(21, 22, t));
  const shakeX = Math.sin(t * 45) * shake * 2;
  const shakeY = Math.cos(t * 51) * shake * 1.5;
  if(pupaVis > 0.01){
    ctx.save();
    ctx.translate(shakeX, shakeY);
    drawPupa(ctx, t * 1000, pupaVis, pupaCapOpen);
    ctx.restore();
  }

  /* 5. MOSCA ADULTA — emergência e voo */
  if(t >= 21.5){
    /* progresso de emergência (0 dentro → 1 fora) */
    const emerge = easeInOut(clamp01((t - TL.EMERGE[0]) / (TL.EMERGE[1] - TL.EMERGE[0])));

    /* posição inicial: topo da pupa; final: acima dela, pronta para voar */
    const pupaTipX = PUPA_POS.x - 53;
    const pupaTipY = PUPA_POS.y - 119;

    let pos, rot, scale = 1.0;

    if(t < TL.TAKEOFF){
      /* emergência: sobe lentamente ao longo do eixo da pupa */
      const u = emerge;
      pos = {
        x: lerp(pupaTipX + 10, pupaTipX - 5, u),
        y: lerp(pupaTipY + 20, pupaTipY - 60, u),
        rot: -0.42 + (1-u) * 0.3
      };
      scale = 0.6 + 0.4 * u;        // mosca "cresce" ao sair
    } else {
      /* voo em arco para fora da tela */
      const ft = clamp01((t - TL.TAKEOFF) / (TL.FLIGHT[1] - TL.FLIGHT[0]));
      const fx = lerp(pupaTipX - 5, pupaTipX - 5 + 600, ft * ft);
      const fy = lerp(pupaTipY - 60, pupaTipY - 60 - 500, ft);
      pos = { x: fx, y: fy, rot: -0.5 + ft * 0.8 };
      scale = 1.0 - ft * 0.1;
    }

    /* spread: quanto as asas estão abertas */
    const spread = smooth(TL.WING_SPREAD - 0.5, TL.WING_SPREAD + 1, t);
    /* flapRate: rápida durante o voo */
    const flapRate = t < TL.TAKEOFF ? 120 : 40;

    /* esmaecer no final */
    const fadeOut = 1 - smooth(29.0, 30.0, t);
    ctx.save();
    ctx.globalAlpha = fadeOut;
    drawAdultFly(ctx, t * 1000, pos, scale, spread, flapRate);
    ctx.restore();
  }

  /* 6. OVERLAYS CINEMATOGRÁFICOS */

  /* cartão-título nos primeiros 2,5 s */
  const titleA = smooth(0, 0.6, t) * (1 - smooth(2.0, 2.6, t));
  if(titleA > 0.01){
    ctx.save();
    ctx.globalAlpha = titleA;
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.fillRect(0, H*0.42, W, 90);
    ctx.fillStyle = '#f5e7d0';
    ctx.textAlign = 'center';
    ctx.font = 'italic 700 34px ui-serif, Georgia, serif';
    ctx.fillText('Drosophila', W/2, H*0.42 + 52);
    ctx.font = 'italic 400 15px ui-serif, Georgia, serif';
    ctx.fillText('um curta procedural · 30 segundos', W/2, H*0.42 + 76);
    ctx.restore();
  }

  /* legenda final */
  const endA = smooth(28.5, 29.5, t);
  if(endA > 0.01){
    ctx.save();
    ctx.globalAlpha = endA * (1 - smooth(30.5, 31, t));
    ctx.fillStyle = '#f5e7d0';
    ctx.textAlign = 'center';
    ctx.font = 'italic 400 16px ui-serif, Georgia, serif';
    ctx.fillText('— fim —', W/2, H - 60);
    ctx.restore();
  }

  /* 7. vinheta */
  const vg = ctx.createRadialGradient(W/2, H/2, H*0.35, W/2, H/2, H*0.85);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(30,10,0,0.30)');
  ctx.fillStyle = vg;
  ctx.fillRect(0,0,W,H);

  /* 8. legendas técnicas discretas */
  ctx.save();
  ctx.font = 'italic 13px ui-serif, Georgia, serif';
  ctx.fillStyle = 'rgba(60,30,15,0.55)';
  ctx.textAlign = 'right';
  const phase = t < 7 ? 'ovo' : t < 14 ? 'larva' :
                t < 21 ? 'pupa' : t < 28 ? 'emergência' : 'voo';
  ctx.fillText(`estágio · ${phase}`, W - 22, H - 22);
  ctx.restore();
}

/* ============================================================
   6. LOOP E CONTROLE DE TEMPO
   ============================================================ */
let rafId = null;
let t0 = performance.now();
let mode = 'idle';   // 'idle' | 'preview' | 'recording'
let recordingStopAt = 0;
let mediaRecorder = null;
let recordedChunks = [];

function loop(now){
  const t = (now - t0) / 1000;
  if(mode === 'recording'){
    if(t >= DURATION){
      drawScene(DURATION);
      stopRecording();
      return;
    }
    drawScene(t);
  } else {
    /* preview: laço contínuo com pausa de 1 s entre repetições */
    const tt = t % (DURATION + 1);
    drawScene(Math.min(tt, DURATION));
  }
  updateClock(Math.min(t, DURATION));
  rafId = requestAnimationFrame(loop);
}

function updateClock(sec){
  const s = Math.floor(sec);
  document.getElementById('clock').textContent =
    `00:${String(s).padStart(2,'0')} / 00:30`;
}

/* ============================================================
   7. GRAVAÇÃO (vídeo + áudio)
   ============================================================ */
async function startRecording(){
  if(mode === 'recording') return;

  /* 1. Prepara motor de som */
  await sound.init();
  sound.monitor(false);   // silencioso para o usuário; ainda assim grava
  sound.stopAll();        // limpa qualquer estado anterior
  await sound.init();

  /* 2. Reinicia animação */
  t0 = performance.now();
  mode = 'recording';

  /* 3. Agenda a trilha sonora a partir de ctx.currentTime */
  sound.scheduleFilm(sound.ctx.currentTime);

  /* 4. Combina streams (vídeo do canvas + áudio) */
  const canvasStream = cvs.captureStream(30);
  const audioStream  = sound.stream();
  const tracks = [
    ...canvasStream.getVideoTracks(),
    ...(audioStream ? audioStream.getAudioTracks() : [])
  ];
  const combined = new MediaStream(tracks);

  recordedChunks = [];
  try {
    mediaRecorder = new MediaRecorder(combined, {
      mimeType: 'video/webm;codecs=vp9,opus',
      videoBitsPerSecond: 12_000_000,
      audioBitsPerSecond: 192_000
    });
  } catch(err){
    /* fallback sem codec específico */
    mediaRecorder = new MediaRecorder(combined, {
      videoBitsPerSecond: 12_000_000
    });
  }

  mediaRecorder.ondataavailable = e => e.data.size && recordedChunks.push(e.data);
  mediaRecorder.onstop = () => {
    const blob = new Blob(recordedChunks, {type:'video/webm'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'drosophila-30s.webm';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    document.getElementById('st').textContent =
      '✅ Filme salvo como drosophila-30s.webm (vídeo + áudio).';
    document.getElementById('rec').disabled = false;
    document.getElementById('stop').disabled = true;
    document.getElementById('preview').disabled = false;
    mode = 'idle';
    sound.monitor(false);
  };
  mediaRecorder.start(100);
  document.getElementById('st').textContent =
    '🔴 Gravando 30 s de filme com trilha sonora…';
  document.getElementById('rec').disabled = true;
  document.getElementById('preview').disabled = true;
  document.getElementById('stop').disabled = false;

  if(!rafId) rafId = requestAnimationFrame(loop);
}

function stopRecording(){
  if(mediaRecorder && mediaRecorder.state !== 'inactive'){
    mediaRecorder.stop();
  }
  sound.stopAll();
  if(rafId){ cancelAnimationFrame(rafId); rafId = null; }
}

/* ============================================================
